name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_nUTs4hzzy0gmcVtsMcBTKc2Z
  VERCEL_PROJECT_ID: prj_V8oJnCGh9JdXYT5w2CwODMXPfFIl

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@60

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          set -euo pipefail
          # Hobby rejects CLI deploys when git metadata names a commit author
          # who is not a team member ("Git author ... must have access to the
          # team"). The CLI reads HEAD via createGitMeta; hide .git for this
          # step so the prebuilt upload has no git author. Token auth is enough.
          # https://vercel.com/docs/deployments/troubleshoot-project-collaboration
          mv .git .git.bak
          trap 'mv .git.bak .git' EXIT
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment URL: ${url}"
