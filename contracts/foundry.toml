[profile.default]
src = "src"
out = "out"
cache_path = "cache"
broadcast = "broadcast"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["aqua/=lib/aqua/src/", "swap-vm/=lib/swap-vm/contracts/", "forge-std/=lib/forge-std/src/", "@1inch/solidity-utils/=lib/solidity-utils/", "@1inch/aqua/src/=lib/aqua/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
[fuzz]
runs = 256
[invariant]
runs = 128
depth = 32
fail_on_revert = false
